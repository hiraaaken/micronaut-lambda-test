services:
  dev:
    container_name: micronaut-lambda-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    working_dir: /app
    mem_limit: 4g
    volumes:
      - ./demo:/app
      - gradle-user-home:/home/dev/.gradle
      - build-output:/app/build
      - gradle-project-cache:/app/.gradle
    tty: true
    stdin_open: true

volumes:
  gradle-user-home:
  build-output:
  gradle-project-cache:

